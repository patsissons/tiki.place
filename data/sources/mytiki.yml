id: mytiki
name: mytiki.life
homepage: https://mytiki.life
adapter: mytiki
status: active
license:
  name: Facts only, attribution
  url: https://mytiki.life/contact
  attribution: Listed on mytiki.life
trust: 0.45
tikiSignal: 0.7
queueNewPlaces: true
schedule:
  discovery: manual
  detailRefreshDays: 120
politeness:
  minIntervalMs: 20000
  maxRequestsPerRun: 200
  userAgent: tiki.place-bot/1.0 (+https://tiki.place/sources)
config:
  base: https://mytiki.life
  sitemap: https://mytiki.life/sitemap.xml
  snapshot: data/snapshots/mytiki.json
addedAt: 2026-11-21
notes: |-
  Collector community site (Craft CMS behind Cloudflare) whose tiki bar section lists ~1,880 bars, past and present,
  plus motels, apartments, parks and other tiki-themed places. robots.txt has no rules or content signals and there is
  no terms page (surveyed 2026-11-21). Bar pages give name, type, phone, a city-level or full address, a closed flag
  and links, but no coordinates. `pnpm sync snapshot-mytiki` reads the sitemap and then one bar page at a time, 20-30 s
  apart, by hand and never from CI, into data/snapshots/mytiki.json; it stops at the first 429/503 or bot challenge.
  This adapter reads only that file. Only open bar-like entries vouch for a place; closed rooms and non-bars only add
  attribution to places we already have. The closed flag is not used as a status hint, and new places always wait for
  the owner's review (queueNewPlaces). Descriptions and photos are never stored.
