notes: |-
  Public community Google My Map "An ongoing project to track all active tiki bars in the states and abroad" (461
  placemarks when surveyed on 2026-11-21); its description invites people to copy and export it. The Tiki Atlas imports
  most of its entries from this map. A weekly run is one request to the KML export, which google.com's robots.txt
  allows (/maps/d/). We store each placemark's name, coordinates and layer, never the author's descriptions. Tiki Bars
  and Tiki Restaurants vouch for a place; Tiki Adjacent and Points of Interest only add attribution, because an adjacent
  bar counts only with a dedicated tiki room or menu. New places always wait for the owner's review (queueNewPlaces).
