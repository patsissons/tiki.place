notes: |-
  One Overpass query per week: theme=tiki plus bar/pub/restaurant/nightclub/cafe with "tiki" in the name.
  Noisy on its own (tiki huts, "Tiki Taka" bars), so it never auto-approves a place by itself; it corroborates
  directories and supplies coordinates, websites and OSM ids.
