name: snapshot-bulk

on:
  schedule:
    - cron: "41 6 1 * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Bulk source to snapshot"
        type: choice
        options: [overture]
        default: overture

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Snapshot
        run: pnpm sync run --source ${{ inputs.source || 'overture' }} --skip-verify --force
      - run: pnpm validate
      - name: Summary
        if: always()
        run: cat .cache/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Commit
        run: |
          git config user.name "tiki-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          git commit -m "data: ${{ inputs.source || 'overture' }} snapshot $(date -u +%F)" -m "$(head -c 60000 .cache/summary.md)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
