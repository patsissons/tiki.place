name: sync

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Only run this source's discovery (forces it even if not due)"
        type: string
        default: ""
      dry_run:
        description: "Compute everything, write nothing"
        type: boolean
        default: false
      skip_verify:
        description: "Skip Google verification"
        type: boolean
        default: false
      force:
        description: "Bypass the circuit breaker and lift the text-search cap (backfills)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # No `version:` here on purpose: pnpm/action-setup reads packageManager from package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .cache/fetch
          key: fetch-${{ github.run_id }}
          restore-keys: fetch-
      - name: Sync
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=""
          [ -n "${{ inputs.source }}" ] && args="$args --source ${{ inputs.source }}"
          [ "${{ inputs.dry_run }}" = "true" ] && args="$args --dry-run"
          [ "${{ inputs.skip_verify }}" = "true" ] && args="$args --skip-verify"
          [ "${{ inputs.force }}" = "true" ] && args="$args --force"
          pnpm sync run $args
      - name: Validate
        run: pnpm validate
      - name: Summary
        if: always()
        run: cat .cache/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Commit
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "tiki-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          git commit -m "data: sync $(date -u +%F)" -m "$(head -c 60000 .cache/summary.md)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
      - name: Open issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `sync failed ${new Date().toISOString().slice(0, 10)}`;
            const body = `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'sync-failure' });
            if (open.length === 0) await github.rest.issues.create({ ...context.repo, title, body, labels: ['sync-failure'] });
